<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TkachLab04</title>
    <style>
        .line {
            margin-top: 30px;
            background-color: #3F3F3F;
            color: #FFFFFF;
            padding: 20px;
            border-top-left-radius: 10px;
            border-bottom-right-radius: 10px;
            border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;
        }
    </style>
</head>

<body background="images/fon.jpg">
    <font size="5" color="#000000" face="Times New Roman">
        <h1 align="center">Коливання</h1>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="right" behavior="alternate" class="line">
            Програмування</marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="left" behavior="scroll" class="line">Програмування</marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="left" behavior="slide" class="line">Програмування</marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="right" scrollamount="3" class="line">Програмування</marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="right" scrollamount="30" style="margin-top: 30px; background-color: #FFFFFF; padding: 20px;
            border-top-left-radius: 10px; border-bottom-right-radius: 10px; border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;"><img src="images/pacman.jpg" width="150"><img src="images/ghost.jpg"
                width="150"><img src="images/cherry.jpg" width="150"></marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="down" height="400" behavior="alternate" class="line"><img src="images/1.jpg" width="200">
            <p>Програмування</p>
        </marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="up" behavior="scroll" height="600" style="margin-top: 30px; background-color: #FFFFFF; padding: 20px;
            border-top-left-radius: 10px; border-bottom-right-radius: 10px; border-top-right-radius: 10px;
            border-bottom-left-radius: 10px; "><img src="images/coin.jpg" width="200">
            <p> <img src="images/coin.jpg" width="200"></p>
            <p><img src="images/mario.jpg" width="200"></p>
        </marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="down" behavior="slide" height="800" style="margin-top: 30px; background-color: #FFFFFF; padding: 20px;
            border-top-left-radius: 10px; border-bottom-right-radius: 10px; border-top-right-radius: 10px;
            border-bottom-left-radius: 10px;"><img src="images/planet1.jpg" width="170">
            <p><img src="images/planet2.jpg" width="170"></p>
            <p><img src="images/planet3.jpg" width="170"></p>
        </marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="up" scrollamount="3" height="100" class="line">Програмування</marquee>
        <hr color="#000000" style="margin-top: 30px;">
        <marquee direction="up" scrollamount="15" height="100" class="line">Програмування</marquee>



    </font>

</body>
